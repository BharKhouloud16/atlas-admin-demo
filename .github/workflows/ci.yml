name: CI

# "Gap technique" demandé le 4 sept. (⭐) : lint/tests/build avant merge,
# sur chaque push et pull request vers main. Le déploiement lui-même reste
# géré par l'intégration Vercel<->GitHub existante (déploiement auto à
# chaque push sur main, indépendant de ce workflow) — ce pipeline sert de
# garde-fou avant que le code n'y arrive, pas de mécanisme de déploiement.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Base Postgres jetable pour ce run uniquement (jamais la base de
    # production) — les migrations sont appliquées explicitement ci-dessous
    # (voir "Migrations (base CI jetable)" ; `npm run build` ne les exécute
    # plus automatiquement, voir package.json et la note du 24/09/2026 plus
    # bas), et les tests E2E ont besoin de données réelles (voir
    # prisma/seed.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_ci
      SESSION_SECRET: ci-secret-uniquement-pour-les-tests-jamais-en-production
      # Toutes les requêtes de test partagent la même IP locale ("inconnue",
      # voir lib/rate-limit.ts) : sans ce relèvement, la suite API+E2E
      # complète (bien plus de 20 connexions au total) déclenche le
      # rate-limiting anti-bruteforce prévu pour de vrais visiteurs distincts
      # en production, où ce seuil reste à 20 (défaut de lib/rate-limit.ts).
      #
      # CI FIX (16/09/2026) — la suite combinée après merge des PR #31/#32/#33
      # (1032 tests) consomme exactement 510 tentatives de connexion sur la
      # fenêtre de 15 min (mesuré directement en base, clé TentativeIp
      # "login:127.0.0.1", compteur final observé lors d'une exécution
      # complète avec seuil temporairement relevé) — dépassait donc le seuil
      # de 500 pour la première fois, provoquant des échecs d'authentification
      # artificiels en fin de suite (pas un défaut de code : voir PR #31/#32/#33,
      # aucune régression réelle identifiée). 600 conserve une limite réelle
      # (~18 % de marge au-dessus de la consommation mesurée, pas une valeur
      # arbitraire) tout en couvrant la suite actuelle ; aucun test ne dépend
      # de la valeur exacte du seuil de rate-limiting lui-même (mécanisme
      # inchangé, toujours actif).
      RATE_LIMIT_LOGIN_MAX_IP: "600"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # FIX (18/10/2026) — passé de Node 20 à Node 22 après un diagnostic
          # contrôlé de 5 échecs consécutifs de "Installation des
          # dépendances" avec l'erreur interne npm "Cannot read properties
          # of null (reading 'edgesOut')" (bug de résolution récursive des
          # peerDependencies optionnelles dans @npmcli/arborist, atteint via
          # la chaîne d'instrumentation OpenTelemetry de @sentry/nextjs qui
          # référence l'écosystème vitest). Comparaison contrôlée, même
          # commit/package.json, même commande (`npm install`), cache npm
          # isolé et vidé à chaque essai, PATH vérifié à chaque fois
          # (`node -v`/`npm -v`/`which`) :
          #   Node 20.20.2 + npm 10.8.2  -> échec reproduit (identique)
          #   Node 20.20.2 + npm 10.9.4  -> échec reproduit (identique)
          #   Node 22.22.0 + npm 10.8.2  -> réussite
          #   Node 22.22.0 + npm 10.9.4  -> réussite
          # La version de npm n'a aucun effet (10.8.2 et 10.9.4 échouent
          # tous les deux sous Node 20) ; seule la version de Node fait la
          # différence. Aucun lockfile ajouté : cette absence reste une
          # décision volontaire et documentée de ce dépôt, non remise en
          # cause ici faute de preuve qu'elle soit la cause (elle ne l'est
          # pas — la même absence de lockfile n'empêche pas Node 22 de
          # réussir). Pas de `cache: npm` ici pour la même raison qu'avant :
          # aucun package-lock.json n'est commité.

      - name: Installation des dépendances
        run: npm install

      - name: Vérification des types TypeScript
        run: npx tsc --noEmit

      # FIX (24/09/2026) — `npm run build` (donc aussi tout build Vercel,
      # Preview comme Production) n'exécute plus `prisma migrate deploy`
      # automatiquement : un build ne doit jamais pouvoir appliquer des
      # migrations à l'insu de qui le déclenche, surtout si un environnement
      # Preview partage un jour une base avec la Production. Les migrations
      # restent une étape explicite et contrôlée — ici, appliquées
      # volontairement à la base CI jetable créée pour ce run uniquement.
      - name: Migrations (base CI jetable)
        run: npm run migrate:deploy

      - name: Build (génère le client Prisma, build Next.js)
        run: npm run build

      - name: Données de démo (pour les tests E2E)
        run: npx tsx prisma/seed.ts

      - name: Installation des navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end (Playwright)
        run: npx playwright test
        env:
          CI: true

      - name: Rapport Playwright (si des tests ont échoué)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
