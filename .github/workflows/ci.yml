name: CI

# "Gap technique" demandé le 4 sept. (⭐) : lint/tests/build avant merge,
# sur chaque push et pull request vers main. Le déploiement lui-même reste
# géré par l'intégration Vercel<->GitHub existante (déploiement auto à
# chaque push sur main, indépendant de ce workflow) — ce pipeline sert de
# garde-fou avant que le code n'y arrive, pas de mécanisme de déploiement.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Base Postgres jetable pour ce run uniquement (jamais la base de
    # production) — les migrations y sont appliquées explicitement (étape
    # "Migrations (base CI jetable)" ci-dessous) : `npm run build` ne les
    # exécute plus. Les tests E2E ont besoin de données réelles (voir
    # prisma/seed.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_ci
      SESSION_SECRET: ci-secret-uniquement-pour-les-tests-jamais-en-production
      SEED_TOKEN: ci-secret-uniquement-pour-les-tests
      # Toutes les requêtes de test partagent la même IP locale ("inconnue",
      # voir lib/rate-limit.ts) : sans ce relèvement, la suite API+E2E
      # complète (bien plus de 20 connexions au total) déclenche le
      # rate-limiting anti-bruteforce prévu pour de vrais visiteurs distincts
      # en production, où ce seuil reste à 20 (défaut de lib/rate-limit.ts).
      #
      # CI FIX (16/09/2026) — la suite combinée après merge des PR #31/#32/#33
      # (1032 tests) consomme exactement 510 tentatives de connexion sur la
      # fenêtre de 15 min (mesuré directement en base, clé TentativeIp
      # "login:127.0.0.1", compteur final observé lors d'une exécution
      # complète avec seuil temporairement relevé) — dépassait donc le seuil
      # de 500 pour la première fois, provoquant des échecs d'authentification
      # artificiels en fin de suite (pas un défaut de code : voir PR #31/#32/#33,
      # aucune régression réelle identifiée). 600 conserve une limite réelle
      # (~18 % de marge au-dessus de la consommation mesurée, pas une valeur
      # arbitraire) tout en couvrant la suite actuelle ; aucun test ne dépend
      # de la valeur exacte du seuil de rate-limiting lui-même (mécanisme
      # inchangé, toujours actif).
      # CI FIX (19/10/2026, PR V1) — même cause, la suite est passée à 1387
      # tests : CI #336 a échoué sur un seul test, le premier à attendre le
      # message « Identifiants invalides » après ~600 connexions depuis la même
      # IP (le limiteur renvoie alors 429 « Trop de tentatives… »). Seuil relevé
      # à 1000 pour la CI uniquement (Production garde sa valeur par défaut,
      # 20 / 15 min) ; la consommation réelle est désormais mesurée à chaque run
      # (étape « Consommation du limiteur de connexion » ci-dessous).
      RATE_LIMIT_LOGIN_MAX_IP: "1000"
      # SÉCURITÉ : liens démo (vérification d'email, réinitialisation de mot de
      # passe) renvoyés dans les réponses API UNIQUEMENT dans ce run CI, sur sa
      # base jetable, pour tester ces parcours sans boîte mail. Jamais sur
      # Vercel (ignoré dès que VERCEL_ENV est défini, voir lib/liens-demo.ts).
      ATLAS_LIENS_DEMO: "oui"
      # Base des liens envoyés par email (lib/email.ts) : sans elle, aucun
      # email contenant un lien n'est tenté (fail-closed, jamais de repli vers
      # le domaine de Production).
      EMAIL_APP_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Pas de `cache: npm` ici : ce dépôt est géré sans installation
          # locale (déploiement par upload web GitHub, voir mémoire projet),
          # donc aucun package-lock.json n'est commité — `actions/setup-node`
          # exigerait un fichier de verrouillage pour son cache, et `npm ci`
          # aussi. On utilise `npm install` ci-dessous à la place.

      - name: Installation des dépendances
        run: npm install

      - name: Vérification des types TypeScript
        run: npx tsc --noEmit

      # Un build (CI, Vercel Preview ou Production) ne doit jamais appliquer
      # de migrations implicitement. Elles restent une étape explicite,
      # appliquée ici uniquement à la base CI jetable de ce run.
      - name: Migrations (base CI jetable)
        run: npm run migrate:deploy

      - name: Build (génère le client Prisma, build Next.js)
        run: npm run build

      - name: Données de démo (pour les tests E2E)
        run: npx tsx prisma/seed.ts

      - name: Installation des navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end (Playwright)
        run: npx playwright test
        env:
          CI: true

      # Lecture seule, base CI jetable : mesure le nombre de tentatives de
      # connexion comptées par le limiteur pendant la suite, pour suivre la
      # marge restante sous RATE_LIMIT_LOGIN_MAX_IP.
      - name: Consommation du limiteur de connexion (diagnostic)
        if: always()
        run: psql "$DATABASE_URL" -c 'SELECT cle, compteur FROM "TentativeIp" ORDER BY compteur DESC LIMIT 5;' || true

      - name: Rapport Playwright (si des tests ont échoué)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
