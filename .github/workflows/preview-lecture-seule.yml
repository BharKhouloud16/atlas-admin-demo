name: Preview — vérification en lecture seule

# Vérifie la Preview Vercel depuis un runner GitHub : commit servi,
# environnement, base ciblée, pages publiques et protections anonymes.
# Requêtes GET anonymes uniquement, aucun secret (voir le script).
# Ne s'exécute que sur la branche de travail : jamais sur main ni v1/delivery.
on:
  push:
    branches: [claude/verify-github-access-63e8vo]

permissions:
  contents: read

jobs:
  preview-lecture-seule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/preview-check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérification (GET anonymes)
        env:
          # hôte@commit attendu
          PREVIEWS: >-
            atlas-admin-demo-git-v1-delivery-bharkhouloud16.vercel.app@798df1b8a25980f4725893b013140db74c92f382,
            atlas-admin-demo-git-claude-verify-github-c1cf49-bharkhouloud16.vercel.app@${{ github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node .github/preview-check/verifier-preview.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-preview
          path: resultats-preview.json
          if-no-files-found: ignore
